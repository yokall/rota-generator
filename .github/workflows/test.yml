name: Test With Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl build-essential \
            libtest2-suite-perl libtest2-harness-perl libdevel-cover-perl \
            libdevel-nytprof-perl libperl-critic-perl perltidy libdist-zilla-perl \
            libemail-sender-perl libemail-mime-perl libauthen-sasl-perl \
            libnet-ssleay-perl libio-socket-ssl-perl liburi-perl \
            libcrypt-openssl-rsa-perl

      - name: Run tests with coverage
        run: yath test t/ --cover=-silent,1,-coverage,statement,branch,condition,subroutine,+ignore,^t/

      - name: Generate coverage report
        run: cover -report=html_basic

      - name: Deploy coverage to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cover_db

      - name: Comment PR with coverage link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('./cover_db/coverage.html', 'utf8');
            const totalRowMatch = coverage.match(/<tr[^>]*class="Total"[^>]*>([\s\S]*?)<\/tr>/);
            let total = 'N/A';
            if (totalRowMatch) {
              const content = totalRowMatch[1];
              const numbers = content.match(/([0-9]+(?:\.[0-9]+)?)/g);
              if (numbers && numbers.length > 0) {
                total = numbers[numbers.length - 1] + '%';
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Tests passed!\n\n📊 **Coverage**: ${total}\n\n[View full coverage report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover_db/
          retention-days: 30
