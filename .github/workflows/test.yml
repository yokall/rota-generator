name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl build-essential \
            libtest2-suite-perl libtest2-harness-perl libdevel-cover-perl \
            libdevel-nytprof-perl libperl-critic-perl perltidy libdist-zilla-perl \
            libemail-sender-perl libemail-mime-perl libauthen-sasl-perl \
            libnet-ssleay-perl libio-socket-ssl-perl liburi-perl \
            libcrypt-openssl-rsa-perl

      - name: Run tests
        run: yath test t/

      - name: Generate coverage report
        run: cover -test -report=html_basic

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cover_db/
          retention-days: 30
